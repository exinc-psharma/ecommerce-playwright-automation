<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SwiftCart SUT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="index.html" class="logo" id="nav-logo" data-testid="nav-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3.8 6h16.4M16 10a4 4 0 0 1-8 0"/>
        </svg>
        SwiftCart
      </a>
      <ul class="nav-links">
        <li><a href="index.html" id="nav-home" data-testid="nav-home">Home</a></li>
        <li><a href="products.html" id="nav-products" data-testid="nav-products">Products</a></li>
        <li>
          <a href="cart.html" id="nav-cart" data-testid="nav-cart">
            Cart <span class="cart-badge" id="cart-count" data-testid="cart-count">0</span>
          </a>
        </li>
        <li id="user-display" class="user-badge" data-testid="user-display" style="display: none;"></li>
        <li id="nav-login"><a href="login.html" class="active btn btn-sm btn-secondary" id="nav-login-link" data-testid="nav-login">Login</a></li>
        <li id="nav-logout" style="display: none;">
          <a href="#" class="btn btn-sm btn-secondary" id="nav-logout-btn" data-testid="nav-logout">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Sign In</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Enter any email and password to log in.</p>

      <div id="login-error-msg" class="alert alert-danger error-message" data-testid="login-error-msg" role="alert"></div>

      <form id="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label for="email-input">Email Address</label>
          <input 
            type="email" 
            id="email-input" 
            name="email" 
            class="input-control" 
            placeholder="user@example.com" 
            data-testid="email-input"
            required
          >
        </div>

        <div class="form-group">
          <label for="password-input">Password</label>
          <input 
            type="password" 
            id="password-input" 
            name="password" 
            class="input-control" 
            placeholder="••••••••" 
            data-testid="password-input"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn" data-testid="login-submit-btn">
          Sign In
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 SwiftCart SUT - Built for Playwright Automated Testing</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
