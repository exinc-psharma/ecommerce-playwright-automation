<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - SwiftCart SUT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="index.html" class="logo" id="nav-logo" data-testid="nav-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3.8 6h16.4M16 10a4 4 0 0 1-8 0"/>
        </svg>
        SwiftCart
      </a>
      <ul class="nav-links">
        <li><a href="index.html" id="nav-home" data-testid="nav-home">Home</a></li>
        <li><a href="products.html" id="nav-products" data-testid="nav-products">Products</a></li>
        <li>
          <a href="cart.html" class="active" id="nav-cart" data-testid="nav-cart">
            Cart <span class="cart-badge" id="cart-count" data-testid="cart-count">0</span>
          </a>
        </li>
        <li id="user-display" class="user-badge" data-testid="user-display" style="display: none;"></li>
        <li id="nav-login"><a href="login.html" class="btn btn-sm btn-secondary" id="nav-login-link" data-testid="nav-login">Login</a></li>
        <li id="nav-logout" style="display: none;">
          <a href="#" class="btn btn-sm btn-secondary" id="nav-logout-btn" data-testid="nav-logout">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="section-header">
      <h2>Checkout</h2>
    </div>

    <div class="cart-layout">
      <!-- Checkout Form -->
      <div style="background: var(--bg-card); padding: 2rem; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);">
        <h3 style="margin-bottom: 1rem;">Shipping Details</h3>

        <div id="checkout-error-msg" class="alert alert-danger error-message" data-testid="checkout-error-msg" role="alert"></div>

        <form id="checkout-form" data-testid="checkout-form" novalidate>
          <div class="form-group">
            <label for="checkout-name">Full Name</label>
            <input 
              type="text" 
              id="checkout-name" 
              name="name" 
              class="input-control" 
              placeholder="John Doe" 
              data-testid="checkout-name"
              required
            >
          </div>

          <div class="form-group">
            <label for="checkout-email">Email Address</label>
            <input 
              type="email" 
              id="checkout-email" 
              name="email" 
              class="input-control" 
              placeholder="john@example.com" 
              data-testid="checkout-email"
              required
            >
          </div>

          <div class="form-group">
            <label for="checkout-address">Shipping Address</label>
            <textarea 
              id="checkout-address" 
              name="address" 
              class="input-control" 
              rows="3" 
              placeholder="123 Main Street, Apt 4B, New York, NY 10001" 
              data-testid="checkout-address"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="checkout-phone">Phone Number</label>
            <input 
              type="tel" 
              id="checkout-phone" 
              name="phone" 
              class="input-control" 
              placeholder="+1 (555) 019-2834" 
              data-testid="checkout-phone"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn" data-testid="place-order-btn">
            Place Order
          </button>
        </form>
      </div>

      <!-- Order Summary Column -->
      <div id="checkout-order-summary" data-testid="checkout-order-summary">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 SwiftCart SUT - Built for Playwright Automated Testing</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout-view.js"></script>
</body>
</html>
