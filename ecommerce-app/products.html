<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Catalog - SwiftCart SUT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="index.html" class="logo" id="nav-logo" data-testid="nav-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3.8 6h16.4M16 10a4 4 0 0 1-8 0"/>
        </svg>
        SwiftCart
      </a>
      <ul class="nav-links">
        <li><a href="index.html" id="nav-home" data-testid="nav-home">Home</a></li>
        <li><a href="products.html" class="active" id="nav-products" data-testid="nav-products">Products</a></li>
        <li>
          <a href="cart.html" id="nav-cart" data-testid="nav-cart">
            Cart <span class="cart-badge" id="cart-count" data-testid="cart-count">0</span>
          </a>
        </li>
        <li id="user-display" class="user-badge" data-testid="user-display" style="display: none;"></li>
        <li id="nav-login"><a href="login.html" class="btn btn-sm btn-secondary" id="nav-login-link" data-testid="nav-login">Login</a></li>
        <li id="nav-logout" style="display: none;">
          <a href="#" class="btn btn-sm btn-secondary" id="nav-logout-btn" data-testid="nav-logout">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="section-header">
      <h2>Products Catalog</h2>
      <span id="result-count" data-testid="result-count" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          class="input-control" 
          placeholder="Search products by name or description..." 
          data-testid="search-input"
          aria-label="Search products"
        >
      </div>
      <div class="filter-box">
        <select id="category-select" class="select-control" data-testid="category-select" aria-label="Filter by category">
          <!-- Populated by JS -->
        </select>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="product-grid" id="products-grid" data-testid="products-grid">
      <!-- Rendered via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 SwiftCart SUT - Built for Playwright Automated Testing</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products-view.js"></script>
</body>
</html>
