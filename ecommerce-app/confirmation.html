<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <nav class="navbar" aria-label="Main Navigation">
      <a href="index.html" class="logo" id="nav-logo" data-testid="nav-logo">

      <ul class="nav-links">
